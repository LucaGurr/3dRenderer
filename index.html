<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Renderer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101010;
        color: #f5f5f5;
      }

      body {
        display: grid;
        justify-items: center;
        gap: 1rem;
        margin: 2rem 1rem;
      }

      form {
        display: flex;
        align-items: end;
        gap: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
      }

      select,
      button {
        min-height: 2.5rem;
        padding: 0.4rem 0.75rem;
        font: inherit;
      }

      button {
        border: 0;
        background: #ff9950;
        color: #101010;
        cursor: pointer;
        font-weight: 600;
      }

      canvas {
        width: min(800px, 90vw);
        height: auto;
        background: #101010;
      }
    </style>
  </head>
  <body>
    <form id="model-form">
      <label for="model-select">
        3D model
        <select id="model-select" name="model">
          <option value="cube">Cube</option>
          <option value="pyramid">Pyramid</option>
          <option value="tetrahedron">Tetrahedron</option>
          <option value="octahedron">Octahedron</option>
          <option value="tux">Tux</option>
        </select>
      </label>
      <button type="submit">Run</button>
    </form>
    <canvas id="game" width="800" height="800" aria-label="Animated 3D model"></canvas>
    <script src="index.js"></script>
  </body>
</html>
